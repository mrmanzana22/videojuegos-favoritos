<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis 5 Videojuegos Favoritos</title>
  <style>
    /* Reset CSS */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
  </style>
</head>
<body>
  <header>
    <h1>Mis 5 Videojuegos Favoritos</h1>
    <p>Una selección personal de los mejores videojuegos de todos los tiempos</p>
  </header>

  <main>
    <section class="juegos-grid">

      <article class="juego-card">
        <img src="https://upload.wikimedia.org/wikipedia/en/a/a5/Grand_Theft_Auto_V.png" alt="Portada de GTA V">
        <div class="juego-info">
          <h2>GTA V</h2>
          <p class="descripcion">Juego de mundo abierto desarrollado por Rockstar Games. Sigue las historias de tres criminales en la ficticia ciudad de Los Santos, con misiones llenas de acción y un modo online masivo.</p>
        </div>
      </article>

    </section>
  </main>
</body>
</html>
